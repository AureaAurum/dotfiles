name: Check dotfiles

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ci
    strategy:
      matrix:
        nushell: ['0.115.1', '0.116.0']
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends stow curl
      - run: |
          version="${{ matrix.nushell }}"
          archive="nu-${version}-x86_64-unknown-linux-gnu"
          curl -fsSL "https://github.com/nushell/nushell/releases/download/${version}/${archive}.tar.gz" -o /tmp/nu.tar.gz
          tar -xzf /tmp/nu.tar.gz -C /usr/local/bin --strip-components=1 "${archive}/nu"
          nu --version
      - run: bash tests/check.sh
