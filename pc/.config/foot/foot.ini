# Foot terminal configuration
# See `man foot.ini` for details

font=Moralerspace Neon:size=11
dpi-aware=yes

# Make selection copy to clipboard directly
selection-target=both

[colors-dark] # Renamed from [colors] to comply with deprecation warning
alpha=0.9
background=292828
foreground=d4be98

# Gruvbox Material Dark colors
regular0=32302f  # black
regular1=ea6962  # red
regular2=a9b665  # green
regular3=d8a657  # yellow
regular4=7daea3  # blue
regular5=d3869b  # magenta
regular6=89b482  # cyan
regular7=d4be98  # white

bright0=5a524c   # bright black
bright1=ea6962   # bright red
bright2=a9b665   # bright green
bright3=d8a657   # bright yellow
bright4=7daea3   # bright blue
bright5=d3869b   # bright magenta
bright6=89b482   # bright cyan
bright7=d4be98   # bright white

[csd]
preferred=server

[key-bindings]
# Match Ghostty's Ctrl+V behavior
clipboard-paste=Control+v # Keep Ctrl+v for pasting from clipboard

[mouse-bindings] # Add mouse-bindings section
# Open a context menu on right-click
clipboard-paste=BTN_RIGHT
select-extend=none
