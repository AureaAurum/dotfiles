# Foot terminal configuration
# See `man foot.ini` for details

font=Moralerspace Neon:size=11
dpi-aware=yes

# Make selection copy to clipboard directly
selection-target=both

# Renamed from [colors] to comply with deprecation warning
[colors-dark]
alpha=0.9
background=292828
foreground=d4be98

# Gruvbox Material Dark colors
regular0=32302f
regular1=ea6962
regular2=a9b665
regular3=d8a657
regular4=7daea3
regular5=d3869b
regular6=89b482
regular7=d4be98

bright0=5a524c
bright1=ea6962
bright2=a9b665
bright3=d8a657
bright4=7daea3
bright5=d3869b
bright6=89b482
bright7=d4be98

[csd]
preferred=server

[key-bindings]
# Match Ghostty's Ctrl+V behavior
# Keep Ctrl+v for pasting from clipboard
clipboard-paste=Control+v

[mouse-bindings]
# Add mouse-bindings section
# Open a context menu on right-click
clipboard-paste=BTN_RIGHT
select-extend=none
